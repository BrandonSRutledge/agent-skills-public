name: Intake
description: Human dump for CoS. Do not implement from intake. File leaves on ops.
title: "[INTAKE] "
labels: ["gate:human"]
body:
  - type: markdown
    attributes:
      value: |
        Humans may file intake here. **Chief of Staff** splits this into bite-sized leaves on [ops-coordination](https://github.com/BrandonSRutledge/ops-coordination/issues/new/choose).

        Workers must **not** `session_start` or implement from an intake issue.

        Prefer ops leaf/TRACK templates when you already know the class.
  - type: textarea
    id: dump
    attributes:
      label: Dump
      description: Raw request, links, and constraints. No secrets, tokens, or SENSITIVE bodies.
      placeholder: What happened / what you want / links
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related issues (optional)
      description: owner/repo#N or URL
      placeholder: ops-coordination#471
  - type: checkboxes
    id: no_secrets
    attributes:
      label: Security
      options:
        - label: This text has no secrets, tokens, license files, or SENSITIVE vault content
          required: true
