name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # gitleaks-action on pull_request events

jobs:
  public-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Only PUBLIC classifications allowed
        run: |
          set -euo pipefail
          if grep -R --include='CLASSIFICATION.y*ml' -nE 'classification:[[:space:]]*(INTERNAL|SENSITIVE)' skills 2>/dev/null; then
            echo "INTERNAL/SENSITIVE classifications are forbidden in the public repo"
            exit 1
          fi
          echo "OK: no INTERNAL/SENSITIVE classifications"

      - name: Every skill has CLASSIFICATION.yaml + SKILL.md (non-empty)
        run: |
          set -euo pipefail
          missing=0
          shopt -s nullglob
          for d in skills/public/*/; do
            [ -d "$d" ] || continue
            if [ ! -f "${d}CLASSIFICATION.yaml" ] && [ ! -f "${d}CLASSIFICATION.yml" ]; then
              echo "Missing CLASSIFICATION.yaml in $d"
              missing=1
            fi
            if [ ! -f "${d}SKILL.md" ]; then
              echo "Missing SKILL.md in $d"
              missing=1
            elif [ ! -s "${d}SKILL.md" ]; then
              echo "Empty SKILL.md in $d"
              missing=1
            fi
            # PUBLIC only in classification file
            clf=$(ls "${d}"CLASSIFICATION.y*ml 2>/dev/null | head -1 || true)
            if [ -n "$clf" ] && ! grep -qE 'classification:[[:space:]]*PUBLIC' "$clf"; then
              echo "Expected classification: PUBLIC in $clf"
              missing=1
            fi
          done
          exit "$missing"

      - name: Block secret-like paths
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|id_rsa|credentials\.json|secrets\.ya?ml$' ; then
            echo "Forbidden secret-like paths"
            exit 1
          fi

      - name: Block sensitive path names
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)skills/sensitive(/|$)|(^|/)private(/|$)' ; then
            echo "Forbidden sensitive path names in public repo"
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  house-scan:
    name: house_scan suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run house_scan (vendored contract pin)
        run: |
          set -euo pipefail
          export HOUSE_SECURITY_LIBRARY="${GITHUB_WORKSPACE}/third_party/house_scan_runtime"
          test -f "${HOUSE_SECURITY_LIBRARY}/CONTRACT_VERSION"
          test -x "${HOUSE_SECURITY_LIBRARY}/scripts/house_scan.sh"
          bash "${HOUSE_SECURITY_LIBRARY}/scripts/consumer_local_ci_fragment.sh" "${GITHUB_WORKSPACE}"
