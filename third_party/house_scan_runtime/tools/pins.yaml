# Pinned scanner tools for house_scan install (no binaries in git).
# Consumer CI contract: docs/CONSUMER_CI_CONTRACT.md
schema_version: "1.0.0"
contract_version: "1.0.0"
install_root_env: HOUSE_SECURITY_TOOLS_ROOT
# Default: ~/.local/share/house-security-tools
tools:
  gitleaks:
    version: "8.24.3"
    github_repo: gitleaks/gitleaks
    # Asset pattern uses {version} and {arch} where arch is x64|arm64
    asset: "gitleaks_{version}_linux_{arch}.tar.gz"
    binary: gitleaks
